services:
  agents:
    build: .
    container_name: crypto_agents_v2
    command: python3 main.py
    volumes:
      - crypto_data:/app/data  # Use the named volume

  dashboard:
    build: .
    container_name: crypto_dashboard_v2
    command: python3 dashboard/app.py
    ports:
      - "8051:8050"
    volumes:
      - crypto_data:/app/data  # Use the SAME named volume

volumes:
  crypto_data:  # Define the volume at the bottom
